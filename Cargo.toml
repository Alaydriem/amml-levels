[workspace]
resolver = "3"
members = ["src/core", "src/amml"]

[workspace.package]
version = "26.63.4"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
curia = "=0.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hcl-rs = "=0.19.8"
levels-core = { path = "src/core" }
# AMML and the mod manager at release tag 26.63.8
amm-client = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.8", default-features = false }
amm-core = { git = "https://github.com/Alaydriem/amml-modmanager.git", tag = "26.63.8" }
amml-api = { git = "https://github.com/Alaydriem/amml.git", tag = "26.63.8" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
