[workspace]
resolver = "3"
members = ["src/core", "src/amml"]

[workspace.package]
version = "26.62.0"
edition = "2024"
rust-version = "1.98"
authors = ["Charles R. Portwood II"]
license = "BSD-3-Clause"
publish = false

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
curia = "=0.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
hcl-rs = "=0.19.8"
levels-core = { path = "src/core" }
# Path dependencies until the release tag: AMML and the mod manager are not tagged for the v3 API yet.
amm-client = { path = "../modmanager/crates/amm-client", default-features = false }
amm-core = { path = "../modmanager/crates/amm-core" }
amml-api = { path = "../amml/sdk/api" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
